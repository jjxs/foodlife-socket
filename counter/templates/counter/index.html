<!-- chat/templates/chat/room.html -->
{% load static %}
<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Chat Room</title>
    <link rel="stylesheet" href="{% static 'bootstrap-4.1.3/css/bootstrap.min.css' %}">
</head>

<body>


    <div class="card bg-light mb-3" style="max-width: 100%;height:40vh">
        <div class="card-header" style="font-size:200%;padding:20px;">支払額は：</div>
        <div class="card-body" style="">
            <div class="alert alert-primary" role="alert" style="height:100%">
                <label id="total" style="font-size:300%;padding:50px;"></label>
            </div>
        </div>
    </div>
    <button value="send" onclick="send()">123123</button>
</body>
<script>
    var chatSocket = new WebSocket(
        'ws://' + window.location.host +
        '/ws/counter/');

    chatSocket.onmessage = function (e) {
        var result = JSON.parse(e.data);
        //var total = data['total'];
        console.log(result.data);
        document.querySelector('#total').innerHTML = "¥" + result.data + "（税込み）";
    };

    chatSocket.onclose = function (e) {
        console.error('Chat socket closed unexpectedly');
    };

    function send() {
        console.log("chatSocket.send");
        chatSocket.send(JSON.stringify({
            'data': '9999'
        }));
    }
</script>

</html>
